<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigos WIKI -  Амигос Вики </title>

    <link rel="stylesheet" href="styles.css?v=15">
</head>

<body>
    <a href="gallery.html" class="gallery-btn">галерея</a>

<div class="container">

    <h1>🔥 Amigos калькулятор</h1>

    <p class="subtitle">
        Лучший рейд-калькулятор для сервера Amigos PVE
    </p>
    <div class="connectcode">
    <code id="code">
        connect 62.122.214.130:20530
    </code>

    <button id="copyBtn">
         📋
    </button>
</div>

    



    <!-- TOPBAR -->
    <div class="topbar">

        <!-- Категория -->
        <div class="select-wrapper">

            <label>📂 Категория</label>

            <select id="category" class="select-box">

                <option value="all">Все</option>

                <option value="wall">
                    🧱 Стены
                </option>

                <option value="door">
                    🚪 Двери
                </option>

                <option value="window">
                    🪟 Окна
                </option>

                <option value="deployable">
                    🏠 Deployables
                </option>

            </select>

        </div>

        <!-- Структура -->
        <div class="select-wrapper">

            <label>🧱 Структура</label>

            <!-- Поиск -->
            <input
                type="text"
                id="search"
                class="select-box"
                placeholder="🔍 Поиск структуры..."
            >

            <!-- Выбор структуры -->
            <select
                id="target"
                class="select-box"
            ></select>

        </div>

        <!-- Режим -->
        <div class="select-wrapper">

            <label>⚙️ Режим расчета</label>

            <select id="mode" class="select-box">

                <option value="cost">
                    💰 Самый дешевый
                </option>

                <option value="speed">
                    ⚡ Самый быстрый
                </option>

            </select>

        </div>

    </div>

    <!-- Кнопка -->
    <div class="actions">

        <button id="calcBtn">
            🔥 Вычислить
        </button>

    </div>

    <!-- Результаты -->
    <div
        id="output"
        class="results-grid"
    ></div>

</div>

<script type="module" src="js/app.js?v=5"></script>
<script src="js/connect.js"></script>
</body>
</html>
