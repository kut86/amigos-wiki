<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Амигос Вики</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css?v=1">
</head>

<body>
    <!-- ФОН САЙТА -->
  <div id="bg-media">
    <video id="bg-video" autoplay muted loop playsinline>
      <source id="bg-video-src" src="" type="video/mp4">
    </video>
    <img id="bg-image" src="" alt="">
  </div>
  <div id="bg-overlay"></div>
<!-- ШАПКА -->
  <header id="header">
    <div id="header-brand" title="Двойной клик — вход для администратора">
      <div id="header-logo">⚙ RUST AMIGOS </div>
      <div id="header-subtitle"> Калькулятор </div>
    </div>
    <div id="header-controls">
      <div id="user-badge" class="hbadge">👁 Гость</div>
      <button id="btn-theme" class="hbtn theme" title="Сменить тему">🌙</button>
       <a href="https://schmel.fwh.is/index.html" class="economy-btn">Экономика</a>
    <a href="gallery.html" class="gallery-btn">навигация по серверу</a>
    <button id="btn-bg-settings" class="abtn orange">🖼 Фон</button>
      <button id="btn-logout" class="hbtn" style="display:none">ВЫЙТИ</button>
    </div>
  </header> 
    
    <!-- НАСТРОЙКИ ФОНА -->
  <div id="modal-bg" class="modal-overlay">
    <div class="modal-box narrow">
      <div class="modal-header">
        <div class="modal-title">🖼 Фон сайта</div>
        <button class="modal-close" data-modal="modal-bg">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-hint">
          Вставь ссылку на картинку, GIF или MP4 видео
        </div>
        <div class="form-row">
          <label>URL фона</label>
          <input id="bg-url" type="url" placeholder="https://...">
        </div>
        <div class="form-row">
          <label>Прозрачность (0.05 — 0.5)</label>
          <input id="bg-opacity" type="number" placeholder="0.15" min="0.05" max="0.5" step="0.05">
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-bg-clear" class="btn-danger">Убрать фон</button>
        <button class="btn-secondary" data-modal="modal-bg">Отмена</button>
        <button id="btn-bg-save" class="btn-primary">Применить</button>
      </div>
    </div>
  </div>
    
   <!-- ================================================
       МОДАЛЬНЫЕ ОКНА
       ================================================ -->

  <!-- АВТОРИЗАЦИЯ GOOGLE -->
  <div id="modal-auth" class="modal-overlay">
    <div class="modal-box narrow">
      <div class="modal-header">
        <div class="modal-title">🔐 Вход администратора</div>
        <button class="modal-close" data-modal="modal-auth">✕</button>
      </div>
      <div class="modal-body" style="text-align:center;padding:30px 20px">
        <div style="font-family:Share Tech Mono,monospace;font-size:12px;color:var(--muted);margin-bottom:24px">
          Вход только для администратора сервера
        </div>
        <button id="btn-google-login" class="btn-primary" style="width:100%;padding:12px;font-size:14px">
          🔑 Войти через Google
        </button>
      </div>
    </div>
  </div>
  

<div class="container">

    <h1>🔥 Amigos калькулятор</h1>

    <p class="subtitle">
        все данные расчитаны на основе рейдов сейчас еще не готовы 
    </p>
    <div class="connectcode">
    <code id="code">
        connect 62.122.214.130:20530
    </code>

    <button id="copyBtn">
         📋
    </button>
</div>

    



    <!-- TOPBAR -->
    <div class="topbar">

        <!-- Категория -->
        <div class="select-wrapper">

            <label>📂 Категория</label>

            <select id="category" class="select-box">

                <option value="all">Все</option>

                <option value="wall">
                    🧱 Стены
                </option>

                <option value="door">
                    🚪 Двери
                </option>

                <option value="window">
                    🪟 Окна
                </option>

                <option value="deployable">
                    🏠 Объекты
                </option>

            </select>

        </div>

        <!-- Структура -->
        <div class="select-wrapper">

            <label>🧱 Структура</label>

            <!-- Поиск -->
            <input
                type="text"
                id="search"
                class="select-box"
                placeholder="🔍 Поиск структуры..."
            >

            <!-- Выбор структуры -->
            <select
                id="target"
                class="select-box"
            ></select>

        </div>

        <!-- Режим -->
        <div class="select-wrapper">

            <label>⚙️ Режим расчета</label>

            <select id="mode" class="select-box">

                <option value="cost">
                    💰 Самый дешевый по сере
                </option>

                <option value="speed">
                    ⚡ общее время крафта
                </option>

            </select>

        </div>

    </div>

    <!-- Кнопка -->
    <div class="actions">

        <button id="calcBtn">
            🔥 Вычислить
        </button>

    </div>

    <!-- Результаты -->
    <div
        id="output"
        class="results-grid"
    ></div>

</div>

<script type="module" src="js/app.js?v=5"></script>
<script src="js/connect.js"></script>
</body>
      </html>
