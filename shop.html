<style>
:root{--bg:#f3f4f8;--card:#fff;--tx:#161a24;--mut:#6b7280;--bd:#e3e6ee;--acc:#6366f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--card:#171b26;--tx:#eef1f8;--mut:#9aa3b5;--bd:#262c3b}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1200px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0}.sub{color:var(--mut);font-size:13px}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 13px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.lab{font-weight:700;font-size:13px;min-width:92px}
.pill{border:1px solid var(--bd);background:transparent;color:var(--tx);padding:6px 11px;border-radius:99px;font:inherit;font-size:13px;cursor:pointer}
.pill.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#fff;font-weight:700}
.pill.r.on{color:#111}
input[type=search],select,input[type=number]{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font:inherit}
input[type=search]{flex:1;min-width:150px}input[type=number]{width:64px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:6px}
.tab{flex:0 0 auto;padding:10px 15px;border-radius:12px 12px 0 0;border:1px solid var(--bd);border-bottom:4px solid var(--c);background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;opacity:.75}
.tab.on{opacity:1;background:var(--c);color:#fff;border-color:var(--c)}
.tab small{opacity:.8;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--rc);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:9px}
.nm{font-weight:800;font-size:16px;line-height:1.25}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.b{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--rc);color:#111}
.b.o{background:transparent;border:1px solid var(--bd);color:var(--mut)}
.b.d{background:#f97316;color:#fff}
.sn{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px dashed var(--bd);border-radius:10px;padding:6px 8px}
.sn code{flex:1;font:600 13px ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.sn button{border:0;background:var(--acc);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-weight:700;font-size:12px;cursor:pointer}
.sn.no code{color:var(--mut);font-weight:500}
.pr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pb{background:var(--bg);border-radius:10px;padding:8px 10px}
.pb span{display:block;font-size:11.5px;color:var(--mut)}.pb b{font-size:19px}
.buy b{color:#16a34a}.sell b{color:#d97706}
.rc{display:flex;flex-wrap:wrap;gap:5px}
.ch{font-size:12px;padding:3px 8px;border-radius:8px;border:1px solid var(--rc);background:color-mix(in srgb,var(--rc) 16%,transparent)}
.ft{font-size:12.5px;color:var(--mut)}.warn{color:#dc2626;font-size:12.5px}

.toast.on{opacity:1}
.empty{padding:40px;text-align:center;color:var(--mut)}

function render(){
 const items=build(),tabItems=items.filter(i=>i.tab==S.tab),tc=TABS.find(t=>t[0]==S.tab)[2];
 $('tabs').innerHTML='';TABS.forEach(([id,l,c])=>{const b=document.createElement('button');b.className='tab'+(S.tab==id?' on':'');b.style.setProperty('--c',c);b.innerHTML=l+' <small>'+items.filter(i=>i.tab==id).length+'</small>';b.onclick=()=>{S.tab=id;S.cat=null;S.rar=null;render()};$('tabs').appendChild(b)});
 pills($('rf'),[[null,'Все редкости','#6366f1'],...RAR.filter(r=>tabItems.some(i=>i.rar==r)).map(r=>[r,r,RC[r]])],S.rar,v=>{S.rar=v;render()},'r');
 const cats=[...new Set(tabItems.map(i=>i.cat))];
 pills($('cf'),[[null,'Все категории',tc],...cats.map((c,i)=>[c,c,CCOL[i%CCOL.length]])],S.cat,v=>{S.cat=v;render()});
 const q=S.q.toLowerCase();
 let L=tabItems.filter(i=>(!S.rar||i.rar==S.rar)&&(!S.cat||i.cat==S.cat)&&(!q||i.name.toLowerCase().includes(q)||(i.short||'').toLowerCase().includes(q)));
 L.sort((a,b)=>S.so=='n'?a.name.localeCompare(b.name,'ru'):S.so=='pa'?(a.buy||0)-(b.buy||0):(b.buy||0)-(a.buy||0));
 const g=$('g');g.innerHTML=L.length?'':'<div class="empty">Ничего не найдено</div>';
 L.forEach(i=>{const c=document.createElement('div');c.className='card';c.style.setProperty('--rc',RC[i.rar]||'#9ca3af');
  const pv=k=>S.edit?'<input type="number" step="any" class="pi" data-k="'+k+'" value="'+(i[k]==null?'':Math.round(i[k]*100)/100)+'"> ₮':'<b>'+fmt(i[k])+' ₮</b>';const ing=(i.ing||[]).map(x=>{const r=D.res[x.n];return'<span class="ch" style="--rc:'+(RC[r?r.rar:'Обычный']||'#9ca3af')+'">'+x.q+'× '+x.n+'</span>'}).join('');
  c.innerHTML='<div class="nm"></div><div class="meta"><span class="b">'+(i.rar||'—')+'</span><span class="b o">'+(i.cat||'')+'</span>'+(i.dlc?'<span class="b d">DLC ×'+D.cfg.dlc+'</span>':'')+(i.stack?'<span class="b o">Стак '+i.stack+'</span>':'')+(i.srcT?'<span class="b o">'+i.srcT+'</span>':'')+'</div>'+
  '<div class="sn'+(i.short?'':' no')+'"><code></code>'+(i.short?'<button>Копировать</button>':'')+'</div>'+
  '<div class="pr"><div class="pb buy"><span>🛒 Покупка (игрок платит)</span>'+pv('buy')+'</div><div class="pb sell"><span>💰 Продажа (игрок получает)</span>'+pv('sell')+'</div></div>'+(i.man?'<div class="ft">✎ Цена задана вручную <button class="pill rv">↺ сбросить</button></div>':'')+(S.edit&&i.tab=='res'?'<div class="ft">Базовая цена ресурса: <input type="number" step="any" class="rp" value="'+D.res[i.name].price+'"> ₮</div>':'')+
  (i.cost!=null?'<div class="ft">Себестоимость: '+fmt(i.cost)+' ₮'+(i.stack>1?' · за стак: '+fmt(i.buy*i.stack)+' ₮':'')+'</div>':'')+
  (ing?'<div class="rc">'+ing+'</div>':'')+(i.bad&&i.bad.length?'<div class="warn">⚠ Нет цены: '+i.bad.join(', ')+'</div>':'')+
  (i.src?'<div class="ft">📍 '+i.src+'</div>':'')+(i.desc?'<div class="ft">'+i.desc+'</div>':'')+(i.note?'<div class="ft">'+i.note+'</div>':'');
  c.querySelector('.nm').textContent=i.name;c.querySelector('code').textContent=i.short||'shortname не указан';
  const bt=c.querySelector('.sn button');if(bt)bt.onclick=()=>copy(i.short);
  const key=i.tab+'|'+i.name;
  c.querySelectorAll('.pi').forEach(p=>p.onchange=()=>{const o=S.ov[key]=S.ov[key]||{};o[p.dataset.k]=p.value===''?null:+p.value;if(o.buy==null&&o.sell==null)delete S.ov[key];save();render()});
  const rv=c.querySelector('.rv');if(rv)rv.onclick=()=>{delete S.ov[key];save();render()};
  const rp=c.querySelector('.rp');if(rp)rp.onchange=()=>{D.res[i.name].price=+rp.value||0;save();render()};g.appendChild(c)});
 const gf=Math.pow(S.base/S.g,S.k),lf=Math.pow(S.base/S.l,S.k);
 $('fx').textContent='Итоговый множитель цен: добытые ресурсы ×'+gf.toFixed(2)+' · лут-компоненты и нелутаемые предметы ×'+lf.toFixed(2)+(gf<1?' (фарм быстрее — цены ниже)':gf>1?' (фарм медленнее — цены выше)':' (как в таблице)');
 $('st').textContent='Ресурсов: '+items.filter(i=>i.tab=='res').length+' · Крафтов: '+items.filter(i=>i.tab=='craft').length+' · Лута: '+items.filter(i=>i.tab=='loot').length+' · Редкость ×'+RAR.map(r=>D.cfg.coef[r]).join('/')+' · покупка ×'+D.cfg.buy+' · продажа ×'+D.cfg.sell;
}
function rateBtns(el,key){pills($(el),[1,2,3,5,10].map(v=>[v,'x'+v,'#6366f1']),S[key],v=>{S[key]=v;rates();render()})}
function rates(){rateBtns('gR','g');rateBtns('lR','l');$('bs').value=S.base;$('kk').value=S.k;$('kv').textContent=Math.round(S.k*100)+'%'}
$('bs').oninput=e=>{S.base=Math.max(1,+e.target.value||3);render()};
$('kk').oninput=e=>{S.k=+e.target.value;$('kv').textContent=Math.round(S.k*100)+'%';render()};
$('q').oninput=e=>{S.q=e.target.value;render()};$('so').onchange=e=>{S.so=e.target.value;render()};
$('up').onclick=()=>$('f').click();$('rs').onclick=()=>{D=parse(EMBED);clr();mpr();render()};
$('f').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'});const raw={};wb.SheetNames.forEach(n=>raw[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}));D=parse(raw);clr();mpr();S.tab='craft';S.cat=null;S.rar=null;render();const t=$('ts');t.textContent='Таблица загружена: '+f.name;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}catch(x){alert('Не удалось прочитать файл: '+x.message)}};r.readAsArrayBuffer(f);e.target.value=''};

function save(){try{localStorage.setItem('shopEdits',JSON.stringify({cfg:D.cfg,rp:Object.fromEntries(Object.values(D.res).map(r=>[r.name,r.price])),ov:S.ov}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('shopEdits')||'null');if(!s)return;Object.assign(D.cfg,s.cfg);for(const n in s.rp)if(D.res[n])D.res[n].price=s.rp[n];S.ov=s.ov||{}}catch(e){}}
function clr(){S.ov={};try{localStorage.removeItem('shopEdits')}catch(e){}}
function mpr(){const m=$('mp');m.hidden=!S.edit;if(!S.edit)return;const c=D.cfg;m.innerHTML='<div class="row"><b>Множители (пересчитывают все цены)</b><button class="btn" id="ra">↺ Сбросить все правки</button></div><div class="row" style="margin-top:8px" id="mf"></div><div class="sub" style="margin-top:6px">Правки сохраняются в этом браузере. Цену конкретного предмета меняйте прямо в карточке.</div>';
 [['🛒 Покупка ×',c,'buy'],['💰 Продажа ×',c,'sell'],['DLC ×',c,'dlc'],...RAR.map(r=>[r+' ×',c.coef,r])].forEach(([l,o,k])=>{const s=document.createElement('span');s.className='sub';s.textContent=l+' ';const i=document.createElement('input');i.type='number';i.step='any';i.value=o[k];i.onchange=()=>{o[k]=+i.value||0;save();render()};s.appendChild(i);$('mf').appendChild(s)});
 $('ra').onclick=()=>{D=parse(EMBED);clr();mpr();render()}}
const rn=n=>n==null?null:(n>=10?Math.round(n):Math.round(n*100)/100);
const TN={res:'Ресурс',craft:'Крафт',loot:'Лут',twitch:'Twitch',dlc:'DLC'};
async function dl(kind){
 const it=build().map(i=>({shortname:i.short||'',name:i.name,type:TN[i.tab],category:i.cat||'',rarity:i.rar||'',stack:i.stack||1,buy:rn(i.buy),sell:rn(i.sell)}));
 let name,data;
 if(kind=='json'){name='shop_prices.json';data=JSON.stringify({rates:{gather:S.g,loot:S.l,tableRate:S.base,influence:S.k},items:it},null,1)}
 else{const ws=XLSX.utils.json_to_sheet(it.map(o=>({'Shortname':o.shortname,'Название':o.name,'Тип':o.type,'Категория':o.category,'Редкость':o.rarity,'Стак':o.stack,'Покупка у магазина (₮)':o.buy,'Продажа магазину (₮)':o.sell})));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Цены');name='shop_prices.xlsx';data=XLSX.write(wb,{bookType:'xlsx',type:'array'})}
 let d=null;try{d=window.claude&&await window.claude.use('downloads')}catch(e){}
 if(d){try{await d.save({filename:name,data});return}catch(e){if(e&&e.code=='declined')return}}
 if(kind=='json'){copy(data,'Скачивание недоступно — JSON скопирован в буфер')}else copy('','Скачивание недоступно в этом окне')}
$('xj').onclick=()=>dl('json');$('xx').onclick=()=>dl('xlsx');
$('ed').onclick=()=>{S.edit=!S.edit;$('ed').classList.toggle('p',S.edit);mpr();render()};
D=parse(EMBED);load();rates();render();
</script></body></html>
