<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Map Admin Pro</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial;
}

/* панель */
#panel {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 9999;
    background: rgba(0,0,0,0.7);
    padding: 10px;
    border-radius: 10px;
    color: white;
    display: flex;
    gap: 5px;
    align-items: center;
}

button {
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    border: none;
}

#loginBtn { background: orange; font-weight: bold; }
#logoutBtn { background: red; color: white; display:none; }

/* карта */
.map {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center;
    transform: translate(-50%, -50%);
}

.map img {
    width: 100%;
}

/* маркеры */
.marker {
    position: absolute;
    transform: translate(-50%, -50%);
    cursor: pointer;
    font-size: 18px;
}
</style>

</head>
<body>

<div id="panel">
    <button id="loginBtn">Войти</button>
    <button id="logoutBtn">Выйти</button>

    <select id="type">
        <option value="loot">💰 Loot</option>
        <option value="boss">💀 Boss</option>
        <option value="quest">📜 Quest</option>
    </select>
</div>

<div class="map" id="map">
    <img src="https://odealo.com/uploads/public/Escape%20from%20Tarkov/Woods%20Guide/Woods_pointsofinterest.jpg">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyA7GnUlFkDcDKAv4ntXC6UZDjAkpaEgPMs",
  authDomain: "tarkovmap-376d0.firebaseapp.com",
  projectId: "tarkovmap-376d0",
  storageBucket: "tarkovmap-376d0.firebasestorage.app",
  messagingSenderId: "693794844907",
  appId: "1:693794844907:web:bb020ca896ae7b07acceae",
  databaseURL: "https://tarkovmap-376d0-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const markersRef = ref(db, "markers");

const map = document.getElementById("map");

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const typeSelect = document.getElementById("type");

let isAdmin = false;
let scale = 1;

/* ZOOM */
document.addEventListener("wheel", (e) => {
    e.preventDefault();
    scale += e.deltaY < 0 ? 0.1 : -0.1;
    scale = Math.min(Math.max(scale, 0.5), 3);
    map.style.transform = `translate(-50%, -50%) scale(${scale})`;
}, { passive: false });

/* LOGIN */
loginBtn.onclick = () => {
    signInWithPopup(auth, provider)
        .catch(e => alert(e.message));
};

/* LOGOUT */
logoutBtn.onclick = () => {
    signOut(auth);
};

/* USER CHECK */
onAuthStateChanged(auth, (user) => {
    if (user && user.email === "pinachet160@gmail.com") {
        isAdmin = true;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
    } else if (user) {
        isAdmin = false;
        loginBtn.style.display = "none";
        logoutBtn.style.display = "inline-block";
    } else {
        isAdmin = false;
        loginBtn.style.display = "inline-block";
        logoutBtn.style.display = "none";
    }
});

/* ADD MARKER */
map.addEventListener("click", (e) => {
    if (!isAdmin) return;

    const rect = map.getBoundingClientRect();

    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;

    const type = typeSelect.value;

    push(markersRef, { x, y, type });
});

/* LOAD MARKERS */
onValue(markersRef, (snapshot) => {

    document.querySelectorAll(".marker").forEach(m => m.remove());

    snapshot.forEach(item => {
        const m = item.val();

        const div = document.createElement("div");
        div.className = "marker";

        div.style.left = m.x + "%";
        div.style.top = m.y + "%";

        /* иконки */
        if (m.type === "loot") div.innerHTML = "💰";
        if (m.type === "boss") div.innerHTML = "💀";
        if (m.type === "quest") div.innerHTML = "📜";

        map.appendChild(div);
    });
});
</script>

</body>
</html>
