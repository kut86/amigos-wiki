<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Map Admin</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #111;
}

/* кнопка входа */
#loginBtn {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 9999;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: orange;
    font-weight: bold;
}

/* карта */
.map-wrapper {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
}

.map {
    position: absolute;
    top: 0;
    left: 0;
    transform-origin: 0 0;
}

.map img {
    width: 100%;
    display: block;
}

/* маркеры */
.marker {
    position: absolute;
    width: 14px;
    height: 14px;
    background: red;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
}
</style>

</head>
<body>

<button id="loginBtn">Войти</button>

<div class="map-wrapper">
    <div class="map" id="map">
        <img src="/gallery/tarkov/images/map.jpg">
    </div>
</div>

<script type="module">
import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import { getDatabase, ref, push, onValue } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

import { getAuth, signInWithEmailAndPassword, onAuthStateChanged }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* 🔥 FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyA7GnUlFkDcDKAv4ntXC6UZDjAkpaEgPMs",
  authDomain: "tarkovmap-376d0.firebaseapp.com",
  projectId: "tarkovmap-376d0",
  storageBucket: "tarkovmap-376d0.firebasestorage.app",
  messagingSenderId: "693794844907",
  appId: "1:693794844907:web:bb020ca896ae7b07acceae",
  databaseURL: "https://tarkovmap-376d0-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth();

const markersRef = ref(db, "markers");
const map = document.getElementById("map");
const loginBtn = document.getElementById("loginBtn");

let scale = 1;
let isAdmin = false;

---

/* 🔍 ZOOM */
document.addEventListener("wheel", (e) => {
    e.preventDefault();

    scale += e.deltaY < 0 ? 0.1 : -0.1;
    scale = Math.min(Math.max(scale, 0.5), 3);

    map.style.transform = `scale(${scale})`;
}, { passive: false });

---

/* 🔐 LOGIN */
loginBtn.onclick = () => {
    const email = prompt("Email:");
    const pass = prompt("Пароль:");

    signInWithEmailAndPassword(auth, email, pass)
        .then(() => alert("Вход выполнен"))
        .catch(() => alert("Ошибка входа"));
};

---

/* 👤 CHECK ADMIN */
onAuthStateChanged(auth, (user) => {
    if (user) {
        isAdmin = true;
        loginBtn.innerText = "Админ";
    } else {
        isAdmin = false;
        loginBtn.innerText = "Войти";
    }
});

---

/* 📍 CLICK → ADD MARKER */
map.addEventListener("click", (e) => {

    if (!isAdmin) return;

    const rect = map.getBoundingClientRect();

    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;

    const text = prompt("Название маркера:");
    if (!text) return;

    push(markersRef, { x, y, text });
});

---

/* 📥 LOAD MARKERS */
onValue(markersRef, (snapshot) => {

    document.querySelectorAll(".marker").forEach(m => m.remove());

    snapshot.forEach(item => {
        const m = item.val();

        const div = document.createElement("div");
        div.className = "marker";
        div.style.left = m.x + "%";
        div.style.top = m.y + "%";
        div.title = m.text;

        map.appendChild(div);
    });
});

</script>

</body>
</html>
