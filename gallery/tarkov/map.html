<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title> Карта лес </title><link rel="stylesheet" href="map.css"></head><body><!-- ВЕРХНЯЯ ПАНЕЛЬ --><div id="topbar"><div class="left-panel">

    <button id="loginBtn">
        Войти
    </button>

    <button id="logoutBtn">
        Выйти
    </button>

    <span id="userStatus">
        Гость
    </span>

</div>

</div><!-- ОБЛАСТЬ КАРТЫ --><div id="viewport"><div id="map">

    <img
        id="mapImage"
        src="images/map.jpg"
        alt="Tarkov Map"
    >

</div>

</div><!-- СОЗДАНИЕ МАРКЕРА --><div id="createModal" class="modal"><div class="modal-content">

    <h2>Создать маркер</h2>

    <select id="markerType">

        <option value="loot">💰 Лут</option>
        <option value="boss">💀 Босс</option>
        <option value="pmc">🔴 ЧВК</option>
        <option value="scav">🟡 Дикий</option>
        <option value="quest">📜 Квест</option>
        <option value="mine">☠️ Мины</option>

    </select>

    <textarea
        id="markerDescription"
        placeholder="Введите описание..."
    ></textarea>

    <div class="modal-buttons">

        <button id="saveMarkerBtn">
            Сохранить
        </button>

        <button id="cancelMarkerBtn">
            Отмена
        </button>

    </div>

</div>

</div><!-- ПРОСМОТР МАРКЕРА --><div id="viewModal" class="modal"><div class="modal-content">

    <h2>Информация</h2>

    <div id="viewText"></div>

    <button id="closeViewBtn">
        Закрыть
    </button>

</div>

</div><script type="module" src="map.js"></script></body>
</html>
