<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Map Admin</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #111;
}

/* кнопка */
#loginBtn {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 9999;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: orange;
    font-weight: bold;
}

/* карта по центру */
.map {
    position: absolute;
    top: 50%;
    left: 50%;
    transform-origin: center;
    transform: translate(-50%, -50%);
}

.map img {
    width: 100%;
    display: block;
}

/* маркеры */
.marker {
    position: absolute;
    width: 14px;
    height: 14px;
    background: red;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    cursor: pointer;
}
</style>

</head>
<body>

<button id="loginBtn">Войти</button>

<div class="map" id="map">
    <img src="https://odealo.com/uploads/public/Escape%20from%20Tarkov/Woods%20Guide/Woods_pointsofinterest.jpg">
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { 
    getAuth, 
    GoogleAuthProvider, 
    signInWithPopup, 
    onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyA7GnUlFkDcDKAv4ntXC6UZDjAkpaEgPMs",
  authDomain: "tarkovmap-376d0.firebaseapp.com",
  projectId: "tarkovmap-376d0",
  storageBucket: "tarkovmap-376d0.firebasestorage.app",
  messagingSenderId: "693794844907",
  appId: "1:693794844907:web:bb020ca896ae7b07acceae",
  databaseURL: "https://tarkovmap-376d0-default-rtdb.firebaseio.com/"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const markersRef = ref(db, "markers");

const map = document.getElementById("map");
const loginBtn = document.getElementById("loginBtn");

let scale = 1;
let isAdmin = false;

console.log("Firebase loaded ✔");

/* 🔍 ZOOM */
document.addEventListener("wheel", (e) => {
    e.preventDefault();

    scale += e.deltaY < 0 ? 0.1 : -0.1;
    scale = Math.min(Math.max(scale, 0.5), 3);

    map.style.transform = `translate(-50%, -50%) scale(${scale})`;
}, { passive: false });

/* 🔐 GOOGLE LOGIN (SAFE VERSION) */
loginBtn.onclick = async () => {
    try {
        const result = await signInWithPopup(auth, provider);
        console.log("LOGIN OK:", result.user.email);
        alert("Вход выполнен: " + result.user.email);

    } catch (e) {
        console.error("LOGIN ERROR:", e);

        if (e.code === "auth/unauthorized-domain") {
            alert("❌ Домен не разрешён в Firebase (Authorized domains)");
        } else if (e.code === "auth/popup-blocked") {
            alert("❌ Браузер заблокировал окно входа");
        } else {
            alert("❌ Ошибка входа: " + e.message);
        }
    }
};

/* 👤 CHECK ADMIN */
onAuthStateChanged(auth, (user) => {

    if (user && user.email === "pinachet160@gmail.com") {
        isAdmin = true;
        loginBtn.innerText = "Админ";
    } else if (user) {
        isAdmin = false;
        loginBtn.innerText = "Нет доступа";
    } else {
        isAdmin = false;
        loginBtn.innerText = "Войти";
    }
});

/* 📍 ADD MARKER */
map.addEventListener("click", (e) => {

    if (!isAdmin) return;

    const rect = map.getBoundingClientRect();

    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;

    const text = prompt("Название маркера:");
    if (!text) return;

    push(markersRef, { x, y, text });
});

/* 📥 LOAD MARKERS */
onValue(markersRef, (snapshot) => {

    document.querySelectorAll(".marker").forEach(m => m.remove());

    snapshot.forEach(item => {
        const m = item.val();

        const div = document.createElement("div");
        div.className = "marker";
        div.style.left = m.x + "%";
        div.style.top = m.y + "%";
        div.title = m.text;

        map.appendChild(div);
    });
});
</script>

</body>
</html>
