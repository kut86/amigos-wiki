<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wiki Map</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="wiki.css">
</head>

<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <select id="mapSelect">
      <option value="woods">Лес</option>
      <option value="customs">Таможня</option>
      <option value="interchange">Развязка</option>
    </select>

    <select id="filter">
      <option value="all">Все</option>
      <option value="loot">Лут</option>
      <option value="boss">Босс</option>
      <option value="quest">Квест</option>
      <option value="exit">Выход</option>
    </select>

    <button id="addModeBtn" style="display:none">+ Маркер</button>
  </div>

  <!-- MAP AREA -->
  <div id="mapWrapper">
    <div id="map">
      <img id="mapImage" draggable="false"/>
    </div>
  </div>

  <!-- MODAL (маркер) -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modalTitle">Маркер</h3>
      <p id="modalDesc"></p>
      <button id="modalClose">Закрыть</button>
    </div>
  </div>

  <!-- ZOOM -->
  <div id="zoomControls">
    <button id="zoomIn">+</button>
    <button id="zoomOut">-</button>
    <button id="zoomReset">⦿</button>
  </div>

  <!-- SCRIPTS -->
  <script type="module" src="wiki.js"></script>

</body>
  </html>
