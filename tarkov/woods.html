<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Map</title>

<link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- LEFT MENU -->
<div id="leftPanel" class="panel left hidden">
  <button id="authBtn">Login</button>
  <button id="logoutBtn" style="display:none">Logout</button>

  <div id="customLinks"></div>
</div>

<button id="toggleLeft">☰</button>

<!-- RIGHT MENU -->
<div id="rightPanel" class="panel right hidden">

  <select id="mapSelect"></select>

  <select id="filter">
    <option value="all">All</option>
    <option value="loot">Loot</option>
    <option value="boss">Boss</option>
    <option value="quest">Quest</option>
  </select>

</div>

<button id="toggleRight">⚙</button>

<!-- MAP -->
<div id="mapWrapper">
  <img id="mapImage" draggable="false" />
  <div id="map"></div>
</div>

<!-- MODAL -->
<div id="modal" class="hidden">
  <div id="modalBox">
    <h3 id="modalTitle"></h3>
    <p id="modalText"></p>
    <img id="modalImg" />
    <button id="modalClose">X</button>
  </div>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
