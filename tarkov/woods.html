<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Woods Map</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- ───────── TOP BAR ───────── -->
<header class="topbar">

  <div class="left-panel">
    <button id="leftToggle">☰</button>

    <button id="loginBtn">Войти</button>
    <button id="logoutBtn" style="display:none;">Выйти</button>

    <span id="adminBadge" style="display:none;">ADMIN</span>

    <div class="external-links">
      <a href="#">Wiki</a>
      <a href="#">Discord</a>
    </div>
  </div>

  <div class="center-panel">
    <select id="mapSelect">
      <option value="woods">Woods</option>
    </select>
  </div>

  <div class="right-panel">
    <button id="rightToggle">☰</button>

    <button id="addModeBtn" style="display:none;">+ Маркер</button>
  </div>

</header>

<!-- ───────── LEFT MENU ───────── -->
<aside id="leftMenu" class="side-menu left hidden-left">

  <h3>Меню</h3>

  <button>Настройки</button>
  <button>Справка</button>
  <button>Discord</button>

</aside>

<!-- ───────── RIGHT MENU ───────── -->
<aside id="rightMenu" class="side-menu right hidden-right">

  <h3>Фильтр</h3>

  <select id="filter">
    <option value="all">Все</option>
    <option value="loot">Лут</option>
    <option value="boss">Боссы</option>
    <option value="quest">Квесты</option>
    <option value="exit">Выходы</option>
  </select>

  <hr/>

  <h3>Карта</h3>
  <select id="mapSelectSide">
    <option value="woods">Woods</option>
  </select>

</aside>

<!-- ───────── MAP ───────── -->
<div id="mapWrapper" class="map-wrapper">

  <div id="map">
    <img id="mapImage" src="images/woods.png" />
  </div>

</div>

<!-- ───────── ADD FORM ───────── -->
<div id="addForm" class="modal-form" style="display:none;">

  <h3>Добавить маркер</h3>

  <input id="addTitle" placeholder="Название"/>

  <select id="addType">
    <option value="loot">Лут</option>
    <option value="boss">Босс</option>
    <option value="quest">Квест</option>
    <option value="exit">Выход</option>
    <option value="structure">Точка интереса</option>
  </select>

  <input id="addIcon" placeholder="URL иконки (необязательно)"/>
  <textarea id="addDescription" placeholder="Описание"></textarea>

  <div class="row">
    <button id="addConfirm">Добавить</button>
    <button id="addCancel">Отмена</button>
  </div>

</div>

<!-- ───────── MODAL ───────── -->
<div id="modal" class="modal">

  <div class="modal-content">

    <button id="modalClose">✕</button>

    <h2 id="modalTitle"></h2>
    <div id="modalType"></div>

    <img id="modalImage" style="display:none;" />

    <p id="modalText"></p>

    <!-- ADMIN -->
    <div id="modalAdminPanel">

      <button id="editBtn">Редактировать</button>
      <button id="deleteBtn">Удалить</button>

      <div id="editForm" style="display:none;">

        <input id="editTitle" placeholder="Название"/>
        <select id="editType">
          <option value="loot">Лут</option>
          <option value="boss">Босс</option>
          <option value="quest">Квест</option>
          <option value="exit">Выход</option>
        </select>

        <input id="editIconUrl" placeholder="Иконка"/>
        <textarea id="editDescription"></textarea>

        <button id="saveBtn">Сохранить</button>
        <button id="cancelEdit">Отмена</button>

      </div>

    </div>

  </div>

</div>

<!-- ───────── TOAST ───────── -->
<div id="toastContainer"></div>

<!-- ───────── SCRIPTS ───────── -->
<script type="module" src="app.js"></script>

</body>
</html>
