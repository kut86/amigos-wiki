<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Woods Map</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body data-map="woods">

  <!-- ─────────────────────
       LEFT MENU
  ───────────────────── -->
  <div id="leftPanel" class="panel left-panel">
    
    <div class="panel-block">
      <button id="loginBtn" class="btn">Войти</button>
      <button id="logoutBtn" class="btn" style="display:none">Выйти</button>
    </div>

    <div class="panel-block">
      <button id="addBtn" class="btn btn-primary" style="display:none">
        + Маркер
      </button>
    </div>

  </div>

  <!-- ─────────────────────
       RIGHT MENU
  ───────────────────── -->
  <div id="rightPanel" class="panel right-panel">

    <div class="panel-block">
      <label>Фильтр</label>
      <select id="filter">
        <option value="all">Все</option>
        <option value="loot">Лут</option>
        <option value="boss">Босс</option>
        <option value="quest">Квест</option>
        <option value="exit">Выход</option>
        <option value="bot">Снайпер</option>
        <option value="structure">Точки</option>
      </select>
    </div>

  </div>

  <!-- ─────────────────────
       MAP
  ───────────────────── -->
  <div id="mapViewport">
    <div id="mapStage">
      <img id="mapImage" src="images/woods.png" alt="woods map" />
    </div>
  </div>

  <!-- ─────────────────────
       JS
  ───────────────────── -->
  <script type="module" src="app.js"></script>

</body>
</html>
