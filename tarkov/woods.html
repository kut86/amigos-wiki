<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Woods Map</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- ───────── TOP BAR ───────── -->
<header class="topbar">

  <!-- LEFT -->
  <div class="left-panel">
    <button id="loginBtn">Войти</button>
    <button id="logoutBtn" style="display:none;">Выйти</button>
    <span id="adminBadge" style="display:none;">ADMIN</span>

    <div class="external-links">
      <a href="#">Wiki</a>
      <a href="#">Discord</a>
    </div>
  </div>

  <!-- CENTER -->
  <div class="center-panel">
    <select id="mapSelect"></select>
  </div>

  <!-- RIGHT -->
  <div class="right-panel">

    <button id="filterToggleBtn">Фильтр</button>
    <button id="mapToggleBtn">Карта</button>

    <button id="addModeBtn" style="display:none;">+ Маркер</button>

  </div>
</header>

<!-- ───────── LEFT SIDE MENU ───────── -->
<aside id="leftMenu" class="side-menu left hidden">

  <h3>Меню</h3>

  <button id="loginBtn2">Войти</button>
  <button id="logoutBtn2">Выйти</button>

  <hr/>

  <button>Настройки</button>
  <button>Справка</button>

</aside>

<!-- ───────── RIGHT SIDE MENU ───────── -->
<aside id="rightMenu" class="side-menu right hidden">

  <h3>Фильтр</h3>

  <select id="filter">
    <option value="all">Все</option>
    <option value="loot">Лут</option>
    <option value="boss">Боссы</option>
    <option value="quest">Квесты</option>
    <option value="exit">Выходы</option>
    <option value="structure">Точки</option>
  </select>

  <hr/>

  <h3>Карты</h3>
  <select id="mapSelectSide"></select>

</aside>

<!-- ───────── MAP ───────── -->
<div id="mapWrapper" class="map-wrapper">

  <div id="map">
    <img id="mapImage" src="images/woods.png" />
  </div>

</div>

<!-- ───────── ADD / EDIT MODAL ───────── -->
<div id="markerModal" class="modal hidden">

  <div class="modal-content">

    <h2 id="modalTitle">Маркер</h2>

    <input id="markerTitle" placeholder="Название маркера"/>

    <select id="markerType">
      <option value="loot">Лут</option>
      <option value="boss">Босс</option>
      <option value="quest">Квест</option>
      <option value="exit">Выход</option>
      <option value="structure">Точка интереса</option>
    </select>

    <input id="markerIcon" placeholder="URL иконки (необязательно)"/>

    <textarea id="markerDescription" placeholder="Описание"></textarea>

    <textarea id="markerExtra" placeholder="Доп. описание (детали)"></textarea>

    <div class="modal-actions">

      <button id="saveMarkerBtn">Сохранить</button>
      <button id="deleteMarkerBtn" class="danger">Удалить</button>
      <button id="closeMarkerBtn">Закрыть</button>

    </div>

  </div>
</div>

<!-- ───────── TOAST ───────── -->
<div id="toastContainer"></div>

</body>
      </html>
